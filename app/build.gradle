plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.openjfx:javafx-base:21.0.3:win"
    implementation "org.openjfx:javafx-graphics:21.0.3:win"
    implementation "org.openjfx:javafx-controls:21.0.3:win"
    implementation "org.openjfx:javafx-media:21.0.3:win"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'drmario.app.Launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

run {
    standardInput = System.in
    systemProperty 'file.encoding', 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}